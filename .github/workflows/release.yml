name: Build release draft

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check version and release notes
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, accessSync } from 'node:fs';
          const read = name => JSON.parse(readFileSync(name, 'utf8'));
          const version = process.env.RELEASE_VERSION;
          const manifest = read('manifest.json');
          const lock = read('package-lock.json');
          if (!/^\d+\.\d+\.\d+$/.test(version) ||
              [manifest.version, read('package.json').version, lock.version,
               lock.packages[''].version].some(value => value !== version) ||
              read('versions.json')[version] !== manifest.minAppVersion) {
            throw new Error('Release tag and package versions must match');
          }
          accessSync(`docs/releases/${version}.md`);
          JS
      - run: npm ci
      - run: npm run check
      - name: Attest the exact installation files
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_VERSION" main.js manifest.json styles.css \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$RELEASE_VERSION" --notes-file "docs/releases/$RELEASE_VERSION.md"
